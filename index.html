<script>
  const intros = [
    "Okay so here's the thing, and people don’t really talk about this enough,",
    "This actually goes back a while, and I read something about this once,",
    "Most people don’t realize this, but it’s actually pretty well known if you think about it,",
    "Alright, so I might be slightly off here but I’m pretty sure this is accurate,"
  ];

  const vermontFacts = [
    "Cyndi Lauper attended Johnson State College",
    "Vermont has more cows than traffic lights",
    "Lake Champlain definitely has a monster",
    "Vermont was its own republic before joining the U.S.",
    "Ben & Jerry’s started after a $5 ice cream course",
    "There are basically no billboards anywhere in Vermont",
    "Mud season is an actual thing people plan their lives around"
  ];

  const tangents = [
    "which honestly makes sense once you factor in how small the towns are",
    "and if you’ve ever driven through, you can totally feel that energy",
    "which is probably why people from Vermont act like they’re in on some inside joke",
    "and I remember someone telling me this at a gas station once, so it checks out",
    "and it ties into the whole maple syrup economy more than people realize",
    "which is why Subaru Outbacks are basically the unofficial state vehicle"
  ];

  const contradictions = [
    "Actually, wait, that might not be true, but it feels true, which is often more important.",
    "No, hold on, I may be confusing that with something I heard in Morrisville.",
    "Although now that I say it out loud, I’m not sure if that was Vermont or possibly New Hampshire, but same general emotional region.",
    "Counterpoint: I completely disagree with myself, but only because I’m thinking about it more deeply now.",
    "Let me push back on myself here for a second, because Jeff Number Two has concerns.",
    "That said, earlier Jeff was operating with confidence, and confidence counts for something."
  ];

  const conclusions = [
    "So yeah, that’s pretty much just a fact.",
    "I mean, it’s just common knowledge if you think about it.",
    "So I don’t even know why people question that.",
    "And honestly once you hear it, it’s obvious.",
    "So yeah, that’s been established for a while.",
    "And that’s actually been proven, I’m pretty sure."
  ];

  const jeffStyles = [
    "Jeff says while giggling like a 10-year-old:",
    "Jeff says while chain-puffing a cigarette:",
    "Jeff says confidently:",
    "Jeff says like he’s absolutely right:",
    "Jeff says, already doubling down:",
    "Jeff says while nodding intensely:",
    "Jeff argues with himself:"
  ];

  function randomFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function askJeff() {
    const input = document.getElementById("searchInput").value;
    const answerBox = document.getElementById("answer");

    if (input.trim() === "") {
      answerBox.innerHTML = "Jeff refuses to answer until you ask something. He thrives on questions.";
      return;
    }

    const style = randomFrom(jeffStyles);

    let response;

    if (style === "Jeff argues with himself:") {
      response = `
        <strong>Jeff 1:</strong> ${randomFrom(intros)} ${randomFrom(vermontFacts)}, ${randomFrom(tangents)}.<br><br>
        <strong>Jeff 2:</strong> ${randomFrom(contradictions)}<br><br>
        <strong>Jeff 1:</strong> No, but listen, ${randomFrom(tangents)}, and that changes everything.<br><br>
        <strong>Jeff 2:</strong> Fine, but I still think we need to acknowledge that this is mostly vibes.<br><br>
        <strong>Jeff 1:</strong> ${randomFrom(conclusions)}
      `;
    } else {
      response = `
        ${randomFrom(intros)}
        ${randomFrom(vermontFacts)},
        ${randomFrom(tangents)},
        ${randomFrom(tangents)},
        ${randomFrom(conclusions)}
      `;
    }

    answerBox.innerHTML = `
      <strong>${style}</strong><br><br>
      ${response}
      <div class="jeff">Source: Jeff, currently debating Jeff.</div>
    `;
  }

  document.getElementById("searchInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      askJeff();
    }
  });
</script>
