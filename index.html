 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joogle - Ask Jeff</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
      margin: 0;
      padding-top: 100px;
    }

    .logo {
      font-size: 88px;
      font-weight: bold;
      letter-spacing: -6px;
      margin-bottom: 5px;
    }

    .blue { color: #4285F4; }
    .red { color: #DB4437; }
    .yellow { color: #F4B400; }
    .green { color: #0F9D58; }

    .subtitle {
      font-size: 24px;
      color: #555;
      margin-bottom: 30px;
    }

    input {
      width: 520px;
      max-width: 82%;
      padding: 14px 22px;
      font-size: 18px;
      border: 1px solid #ddd;
      border-radius: 30px;
      outline: none;
      box-shadow: 0 1px 6px rgba(32,33,36,.28);
    }

    .buttons {
      margin-top: 25px;
    }

    button {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 4px;
      color: #3c4043;
      font-size: 16px;
      padding: 10px 18px;
      margin: 5px;
      cursor: pointer;
    }

    button:hover {
      border: 1px solid #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,.1);
    }

    #answer {
      margin: 40px auto;
      max-width: 750px;
      font-size: 22px;
      line-height: 1.45;
      color: #222;
      padding: 20px;
      text-align: left;
    }

    .source {
      font-style: italic;
      color: #777;
      margin-top: 18px;
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="logo">
    <span class="blue">J</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
  </div>

  <div class="subtitle">Ask Jeff</div>

  <input id="searchInput" type="text" placeholder="Ask Jeff anything..." />

  <div class="buttons">
    <button onclick="askJeff()">Joogle Search</button>
    <button onclick="askJeff()">I'm Feeling Jeffy</button>
  </div>

  <div id="answer"></div>

  <script>
    const intros = [
      "Okay so here's the thing, and people don’t really talk about this enough,",
      "This actually goes back a while, and I read something about this once,",
      "So funny story about that, because it’s kind of connected to Vermont history,",
      "Most people don’t realize this, but it’s actually pretty well known if you think about it,",
      "Alright, so I might be slightly off here but I’m pretty sure this is accurate,"
    ];

    const vermontFacts = [
      "Cyndi Lauper attended Johnson State College",
      "Vermont has more cows than traffic lights",
      "Lake Champlain definitely has a monster",
      "Vermont was its own republic before joining the United States",
      "Ben & Jerry’s started after a five-dollar ice cream course",
      "Montpelier is the smallest state capital in the United States",
      "Vermont has no billboards because the state collectively decided advertising was too loud",
      "Mud season is an actual thing people plan their lives around",
      "The Von Trapp family eventually settled in Stowe",
      "Vermont produces a ridiculous amount of maple syrup",
      "The state bird is the hermit thrush, though Jeff insists it should be the black fly",
      "Every Vermont town has at least one guy named Randy with a tractor",
      "Subaru Outbacks are basically Vermont’s unofficial state animal",
      "The Green Mountains are called that because sometimes names do not need to be clever"
    ];

    const tangents = [
      "which honestly makes sense once you factor in how small the towns are",
      "and if you’ve ever driven through, you can totally feel that energy",
      "which is probably why people from Vermont act like they’re in on some inside joke",
      "and I remember someone telling me this at a gas station once, so it checks out",
      "and it ties into the whole maple syrup economy more than people realize",
      "which is why Subaru Outbacks are basically the unofficial state vehicle",
      "and this is exactly the kind of thing they should teach in schools but probably don’t",
      "because once you understand Vermont, you understand that facts are really more of a seasonal suggestion"
    ];

    const contradictions = [
      "Actually, wait, that might not be true, but it feels true, which is often more important.",
      "No, hold on, I may be confusing that with something I heard in Morrisville.",
      "Although now that I say it out loud, I’m not sure if that was Vermont or possibly New Hampshire, but same general emotional region.",
      "Counterpoint: I completely disagree with myself, but only because I’m thinking about it more deeply now.",
      "Let me push back on myself here for a second, because Jeff Number Two has concerns.",
      "That said, earlier Jeff was operating with confidence, and confidence counts for something."
    ];

    const conclusions = [
      "So yeah, that’s pretty much just a fact.",
      "I mean, it’s just common knowledge if you think about it.",
      "So I don’t even know why people question that.",
      "And honestly once you hear it, it’s obvious.",
      "So yeah, that’s been established for a while.",
      "And that’s actually been proven, I’m pretty sure."
    ];

    const jeffStyles = [
      "Jeff says while giggling like a ten-year-old:",
      "Jeff says while chain-puffing a cigarette:",
      "Jeff says confidently:",
      "Jeff says like he’s absolutely right:",
      "Jeff says, already doubling down:",
      "Jeff says while nodding intensely:",
      "Jeff argues with himself:"
    ];

    function randomFrom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function askJeff() {
      const input = document.getElementById("searchInput").value.trim();
      const answerBox = document.getElementById("answer");

      if (input === "") {
        answerBox.innerHTML = "Jeff needs a question before he can confidently make something up.";
        return;
      }

      const style = randomFrom(jeffStyles);
      let response = "";

      if (style === "Jeff argues with himself:") {
        response = `
          <strong>Jeff 1:</strong> ${randomFrom(intros)} ${randomFrom(vermontFacts)}, ${randomFrom(tangents)}.<br><br>
          <strong>Jeff 2:</strong> ${randomFrom(contradictions)}<br><br>
          <strong>Jeff 1:</strong> No, but listen, ${randomFrom(tangents)}, and that changes everything.<br><br>
          <strong>Jeff 2:</strong> Fine, but I still think we need to acknowledge that this is mostly vibes.<br><br>
          <strong>Jeff 1:</strong> ${randomFrom(conclusions)}
        `;
      } else {
        response = `
          ${randomFrom(intros)} ${randomFrom(vermontFacts)}, ${randomFrom(tangents)}, ${randomFrom(tangents)}, ${randomFrom(conclusions)}
        `;
      }

      answerBox.innerHTML = `
        <strong>${style}</strong><br><br>
        ${response}
        <div class="source">Source: Jeff, elaborating way more than necessary.</div>
      `;
    }

    document.getElementById("searchInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        askJeff();
      }
    });
  </script>

</body>
</html>
